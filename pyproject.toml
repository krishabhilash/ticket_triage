[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-triage"
version = "0.1.0"
description = "Classical support-ticket routing baseline"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.3,<2",
  "pandas>=2.0,<3",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
llm = ["google-genai>=1.0,<2"]
test = ["pytest>=8,<9"]

[project.scripts]
score-ticket-classifier = "ticket_triage.score:main"
train-ticket-classifier = "ticket_triage.train:main"
evaluate-llm-classifier = "ticket_triage.llm_evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
